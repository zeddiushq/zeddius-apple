name: Zeddius
options:
  bundleIdPrefix: com.zeddius
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release
configFiles:
  Debug-Dev: Config/Dev.xcconfig
  Release-Dev: Config/Dev.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Zeddius:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Zeddius
    info:
      path: Zeddius/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: "$(API_BASE_URL)"
    entitlements:
      path: Zeddius/Zeddius.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)"
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3XPMRGWL24"
schemes:
  Zeddius Dev:
    build:
      targets:
        Zeddius: all
    run:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Zeddius:
    build:
      targets:
        Zeddius: all
    run:
      config: Debug-Prod
    archive:
      config: Release-Prod
