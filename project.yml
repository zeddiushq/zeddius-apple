name: Zeddius
options:
  bundleIdPrefix: com.zeddius
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Zeddius:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Zeddius
    info:
      path: Zeddius/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Zeddius
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Zeddius/Zeddius.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.zeddius.shared"
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeddius.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3XPMRGWL24"
schemes:
  Zeddius:
    build:
      targets:
        Zeddius: all
    run:
      config: Debug
    archive:
      config: Release
